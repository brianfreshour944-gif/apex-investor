[project]
name = "apex-investor"
version = "0.1.0"
description = "Long-term, evidence-driven investment manager (simulation only)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["pandas>=2.0", "pyarrow>=15"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# print is the console-output surface for CLI scripts and test diagnostics
"scripts/*" = ["T201"]
"tests/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
